[project]
name = "oct-retinal-classifier"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchvision>=0.17", "numpy", "scikit-learn", "matplotlib", "opencv-python-headless", "pillow"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
# so plain `pytest` can import the octclf package
pythonpath = ["."]
